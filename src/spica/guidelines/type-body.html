<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--body);background:var(--base);color:var(--ink);padding:20px;-webkit-font-smoothing:antialiased}
.row{display:flex;gap:12px}.col{flex:1}.sw{border:1px solid var(--border);border-radius:12px;overflow:hidden}
.cap{font-family:var(--mono);font-size:11px;color:var(--ink-muted);padding:8px 10px}
.nm{font-family:var(--mono);font-size:12px;color:var(--ink);padding:8px 10px 0}
.ey{font-family:var(--body);font-size:12.5px;font-weight:700;color:var(--primary-deep);margin:0 0 12px}</style></head><body><p class="ey">Body · Nunito</p><p style="font-size:16px;line-height:1.6;max-width:62ch;margin:0">Define your schema first — everything downstream depends on it. Nunito keeps body copy soft and friendly — round, warm, easy on dense pages — with inline <code style="font-family:var(--mono);font-size:.88em;background:var(--surface-2);padding:.08em .34em;border-radius:4px;color:var(--primary-deep)">code</code> set in JetBrains Mono. <em>Worth noting</em> — italics carry the warm aside.</p></body></html>
