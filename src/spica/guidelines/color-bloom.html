<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--body);background:var(--base);color:var(--ink);padding:20px;-webkit-font-smoothing:antialiased}
.row{display:flex;gap:12px}.col{flex:1}.sw{border:1px solid var(--border);border-radius:12px;overflow:hidden}
.cap{font-family:var(--mono);font-size:11px;color:var(--ink-muted);padding:8px 10px}
.nm{font-family:var(--mono);font-size:12px;color:var(--ink);padding:8px 10px 0}
.ey{font-family:var(--body);font-size:12.5px;font-weight:700;color:var(--primary-deep);margin:0 0 12px}</style></head><body><div class="row"><div class="sw col"><div style="height:76px;background:var(--attention)"></div><div class="nm">--attention</div><div class="cap">focus / modal bloom</div></div><div class="sw col"><div style="height:76px;background:var(--bloom)"></div><div class="nm">--bloom</div><div class="cap">#F6BCD6</div></div><div class="sw col"><div style="height:76px;background:var(--bloom-soft)"></div><div class="nm">--bloom-soft</div><div class="cap">#FDEDF3</div></div></div></body></html>
