<!-- @dsCard group="Colors" viewport="700x170" subtitle="Near-white base + soft pastel corner blooms — five moods" name="Surface washes" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--body);background:var(--base);color:var(--ink);padding:20px;-webkit-font-smoothing:antialiased}
.row{display:flex;gap:12px}.col{flex:1}.sw{border:1px solid var(--border);border-radius:12px;overflow:hidden}
.cap{font-family:var(--mono);font-size:11px;color:var(--ink-muted);padding:8px 10px}
.nm{font-family:var(--mono);font-size:12px;color:var(--ink);padding:8px 10px 0}
.ey{font-family:var(--body);font-size:12.5px;font-weight:700;color:var(--primary-deep);margin:0 0 12px}</style></head><body><div class="row">
<div class="sw col"><div style="height:84px;background:var(--surface-wash)"></div><div class="cap">--surface-wash</div></div>
<div class="sw col"><div style="height:84px;background:var(--surface-wash-rose)"></div><div class="cap">…-rose</div></div>
<div class="sw col"><div style="height:84px;background:var(--surface-wash-cool)"></div><div class="cap">…-cool</div></div>
<div class="sw col"><div style="height:84px;background:var(--surface-wash-iris)"></div><div class="cap">…-iris</div></div>
<div class="sw col"><div style="height:84px;background:var(--surface-wash-dawn)"></div><div class="cap">…-dawn</div></div></div></body></html>
