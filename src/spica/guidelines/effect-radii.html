<!-- @dsCard group="Spacing" viewport="700x150" subtitle="Friendly rounding — 6 / 10 / 12 / 16" name="Radii" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--body);background:var(--base);color:var(--ink);padding:20px;-webkit-font-smoothing:antialiased}
.row{display:flex;gap:12px}.col{flex:1}.sw{border:1px solid var(--border);border-radius:12px;overflow:hidden}
.cap{font-family:var(--mono);font-size:11px;color:var(--ink-muted);padding:8px 10px}
.nm{font-family:var(--mono);font-size:12px;color:var(--ink);padding:8px 10px 0}
.ey{font-family:var(--body);font-size:12.5px;font-weight:700;color:var(--primary-deep);margin:0 0 12px}</style></head><body><div style="display:flex;gap:16px;align-items:flex-end">
<div style="text-align:center"><div style="width:90px;height:60px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:6px"></div><div class="cap">6 · chip</div></div>
<div style="text-align:center"><div style="width:90px;height:60px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:10px"></div><div class="cap">10 · button</div></div>
<div style="text-align:center"><div style="width:90px;height:60px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:12px"></div><div class="cap">12 · card</div></div>
<div style="text-align:center"><div style="width:90px;height:60px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:16px"></div><div class="cap">16 · frame</div></div></div></body></html>
