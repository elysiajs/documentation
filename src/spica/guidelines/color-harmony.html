<!-- @dsCard group="Colors" viewport="700x190" subtitle="A cool spread — left · center · right of the primary" name="Harmonic supports" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--body);background:var(--base);color:var(--ink);padding:20px;-webkit-font-smoothing:antialiased}
.row{display:flex;gap:12px}.col{flex:1}.sw{border:1px solid var(--border);border-radius:12px;overflow:hidden}
.cap{font-family:var(--mono);font-size:11px;color:var(--ink-muted);padding:8px 10px}
.nm{font-family:var(--mono);font-size:12px;color:var(--ink);padding:8px 10px 0}
.ey{font-family:var(--body);font-size:12.5px;font-weight:700;color:var(--primary-deep);margin:0 0 12px}</style></head><body><div class="row"><div class="sw col"><div style="height:76px;background:var(--harmony-left)"></div><div class="nm">--harmony-left</div><div class="cap">#A8CDF0 · left · coolest</div></div><div class="sw col"><div style="height:76px;background:var(--harmony-center)"></div><div class="nm">--harmony-center</div><div class="cap">#C9D2F2 · center · periwinkle</div></div><div class="sw col"><div style="height:76px;background:var(--harmony-right)"></div><div class="nm">--harmony-right</div><div class="cap">#CFB4E8 · right · nearest primary</div></div></div></body></html>
