<!-- @dsCard group="Spacing" viewport="700x170" subtitle="Warm-tinted elevation — never blue-black" name="Shadow & light tiers" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--body);background:var(--base);color:var(--ink);padding:20px;-webkit-font-smoothing:antialiased}
.row{display:flex;gap:12px}.col{flex:1}.sw{border:1px solid var(--border);border-radius:12px;overflow:hidden}
.cap{font-family:var(--mono);font-size:11px;color:var(--ink-muted);padding:8px 10px}
.nm{font-family:var(--mono);font-size:12px;color:var(--ink);padding:8px 10px 0}
.ey{font-family:var(--body);font-size:12.5px;font-weight:700;color:var(--primary-deep);margin:0 0 12px}</style></head><body><div style="display:flex;gap:20px;align-items:center;padding:8px">
<div style="text-align:center"><div style="width:120px;height:54px;background:var(--base);border:1px solid var(--border);border-radius:10px"></div><div class="cap">flat · page</div></div>
<div style="text-align:center"><div style="width:120px;height:54px;background:var(--base);border:1px solid var(--border-strong);border-radius:10px;box-shadow:var(--shadow-md)"></div><div class="cap">quiet glass</div></div>
<div style="text-align:center"><div style="width:120px;height:54px;background:var(--base);border:1px solid var(--primary-line);border-radius:10px;box-shadow:var(--shadow-attention)"></div><div class="cap">attention light</div></div></div></body></html>
