<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--body);background:var(--base);color:var(--ink);padding:20px;-webkit-font-smoothing:antialiased}
.row{display:flex;gap:12px}.col{flex:1}.sw{border:1px solid var(--border);border-radius:12px;overflow:hidden}
.cap{font-family:var(--mono);font-size:11px;color:var(--ink-muted);padding:8px 10px}
.nm{font-family:var(--mono);font-size:12px;color:var(--ink);padding:8px 10px 0}
.ey{font-family:var(--body);font-size:12.5px;font-weight:700;color:var(--primary-deep);margin:0 0 12px}</style></head><body><div class="row"><div class="sw col" style="border-color:var(--night-2)"><div style="height:84px;background:var(--surface-night)"></div><div class="cap" style="color:var(--ink-muted)">--surface-night</div></div><div class="sw col"><div style="height:84px;background:var(--night)"></div><div class="nm">--night</div><div class="cap">#0B0E20</div></div><div class="sw col"><div style="height:84px;background:var(--night-2)"></div><div class="nm">--night-2</div><div class="cap">#141A36</div></div></div></body></html>
